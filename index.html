<script type="text/javascript">

var html = {};

(function(){

html.id = function (id) { return document.getElementById(id); };

html.class = function (e, n, o) {
	var eo = ' '+e.className+' ', en = eo;
	if ('' != o && -1 != en.indexOf(' '+o+' ')) en = en.replace(' '+o+' ', ' ');
	if ('' != n && -1 == en.indexOf(' '+n+' ')) en = en+n+' ';
	if (en == eo) return;
	
	e.className = en.replace(/^ /, '').replace(/ $/, '');
};

html.toggle = function (e, c) {
	var ec = ' '+e.className+' ', ret = -1 == ec.indexOf(' '+c+' ');
	if (ret) ec = ec+c+' ';
	else ec = ec.replace(' '+c+' ', ' ');
	
	e.className = ec.replace(/^ /, '').replace(/ $/, '');
	return ret;
};

html.has = function (e, c) { return -1 != (' '+e.className+' ').indexOf(' '+c+' '); };

html.data = function (e, k, v) {
	if ('undefined' == typeof v) {
		v = e.getAttribute(k);
		return null == v ? null : JSON.parse(v);
	}
	else if (null == v)
		e.removeAttribute(k);
	else
		e.setAttribute(k, JSON.stringify(v));
};

// anti-xss variant of `e.innerHTML = text`
html.text = function (e, text) {
	e.innerHTML = '';
	e.appendChild(document.createTextNode(text));
};

})();

</script>
<script type="text/javascript">

var
	color = 1,
	square = [],
	path = [],
	cellpathEnd, cellpathCleanable,
	mouseIsDown = false;

function posNew (y, x) { return [ y, x ]; }
function posEq (a, b) { return a[0] == b[0] && a[1] == b[1]; }

function squareAt (pos) { return square[pos[0]][pos[1]]; }

// cellpath

function cellpathContinues (pos) {
	if (!path.length) return true;
	
	var p = path[path.length-1];
	return (
		pos[0] == p[0] &&
			(pos[1] == p[1]+1 || pos[1] == p[1]-1) ||
		pos[1] == p[1] &&
			(pos[0] == p[0]+1 || pos[0] == p[0]-1));
}

function cellpathAdd (node, pos, s) {
	$class(node, 'color-'+color, '');
	s.color = color;
	path.push(pos);
}

function cellpathTryEnd () {
	if (!path.length) return;
	if ('undefined' != typeof squareAt(path[0]).prev) return;
	
	var s = squareAt(path[path.length-1]);
	if ('undefined' == typeof s.last) return;
	
	for (var i = path.length-1; i; i--) {
		if ('undefined' == typeof s.prev) return;
		if (!posEq(s.prev, path[i-1])) return;
		
		s = squareAt(s.prev);
	}
	
	var key = '';
	for (var i = 0; i != path.length; i++) key += squareAt(path[i]).text;
	
	var info = null;
	for (var i = 0; i != SquareInfos.length; i++)
		if (key == SquareInfos[i].key)
			{ info = SquareInfos[i]; break; }
	if (info) {
		var
			first = $('info'),
			i = first.cloneNode(true);
		i.removeAttribute('id');
		i.style.display = '';
		
		i.getElementsByClassName('info-title')[0].innerHTML = info.title;
		i.getElementsByClassName('info-details')[0].innerHTML = info.details;
		
		var iLink = i.getElementsByClassName('info-link')[0];
		iLink.innerHTML = info.link[0];
		iLink.href = info.link[1];
		
		first.parentNode.insertBefore(i, first.nextSibling);
	}
	
	path = [];
	color++;
}

function cellpathClearWhole (cleanColor) {
	for (var i = 0; i != 8; i++)
		for (var j = 0; j != 8; j++) {
			var sq = square[i][j];
			if (!(
				'undefined' != typeof sq.color &&
				cleanColor == sq.color
			)) continue;
			
			$class(sq.node, '', 'color-'+sq.color);
			delete sq.color;
		}
}

function cellpathClearTail (pos, clearPos) {
	var end;
	for (end = 0; !posEq(pos, path[end]); end++) ;
	if (!clearPos) end++;
	
	for (var j = end; j != path.length; j++) {
		var sq = squareAt(path[j]);
		$class(sq.node, '', 'color-'+sq.color);
		delete sq.color;
	}
	
	path.splice(end);
}

// drag

function dragStart (node) {
	var
		pos = $data(node, 'pos'),
		s = squareAt(pos);
	
	cellpathCleanable = 'undefined' != typeof s.color && color == s.color && path.length && posEq(pos, path[path.length-1]);
	
	if ('undefined' != typeof s.color && color == s.color)
		cellpathClearTail(pos, false);
	else {
		if ('undefined' != typeof s.color)
			cellpathClearWhole(s.color);
		
		if (!cellpathContinues(pos)) {
			cellpathClearWhole(color);
			path = [];
		}
		cellpathAdd(node, pos, s);
	}
	
	cellpathEnd = pos;
}

function dragEnter (node) {
	var
		pos = $data(node, 'pos'),
		s = squareAt(pos);
	
	if ('undefined' != typeof s.color && color == s.color)
		cellpathClearTail(pos, false);
	else {
		if ('undefined' != typeof s.color)
			return;
		
		if (!cellpathContinues(pos))
			return;
		
		cellpathAdd(node, pos, s);
	}
	
	if (!posEq(cellpathEnd, pos))
		cellpathCleanable = false;
	cellpathEnd = pos;
}

function dragFinish (node) {
	if (cellpathCleanable) {
		var pos = $data(node, 'pos');
		if (null != pos && posEq(pos, path[path.length-1]))
			cellpathClearTail(pos, true);
	}
	
	cellpathTryEnd();
}

// events

function cellMouseDown (e) {
	dragStart(e.target);
}

function cellMouseEnter (e, skipMouseIsDownCheck) {
	if (!mouseIsDown) return;
	dragEnter(e.target);
}

function docMouseDown (e) {
	e.preventDefault();
	mouseIsDown = true;
}

function docMouseUp (e) {
	mouseIsDown = false;
	dragFinish(e.target);
}

/*
	https://stackoverflow.com/questions/13655919/how-to-bind-both-mousedown-and-touchstart-but-not-respond-to-both-android-jqu
	https://developer.mozilla.org/en-US/docs/Web/API/Touch_events#additional_tips
	
	Since calling preventDefault() on a touchstart or the first touchmove event
	of a series prevents the corresponding mouse events from firing, it's common
	to call preventDefault() on touchmove rather than touchstart. That way, mouse
	events can still fire and things like links will continue to work. */
function cellTouchStart (e) {
	e.preventDefault();
	dragStart(e.target);
}

function cellTouchEnd (e) {
	dragFinish(e.target);
}

function cellTouchMove (e) {
	e.preventDefault();
	var t = e.touches[0];
	
	for (var i = 0; i != 8; i++)
		for (var j = 0; j != 8; j++) {
			var
				n = square[i][j].node,
				y = n.offsetTop/* + n.offsetParent.offsetTop*/,
				x = n.offsetLeft/* + n.offsetParent.offsetLeft*/,
				h = n.clientHeight, w = n.clientWidth;
			if (!(
				y <= t.pageY && t.pageY <= y+h &&
				x <= t.pageX && t.pageX <= x+w
			)) continue;
			
			dragEnter(n);
			return;
		}
}

// init

for (var i = 0; i != 8; i++) {
	square[i] = [];
	for (var j = 0; j != 8; j++)
		// text, prev, last, color, node
		square[i][j] = { text:SquareSource[i][j*3] };
}
for (var i = 0; i != 8; i++)
	for (var j = 0; j != 8; j++)
		switch (SquareSource[i][j*3+1]) {
		case '^': square[i-1][j].prev = [ i, j ]; break
		case '>': square[i][j+1].prev = [ i, j ]; break
		case '_': square[i+1][j].prev = [ i, j ]; break
		case '<': square[i][j-1].prev = [ i, j ]; break
		case '!': square[i][j].last = true; break;
		}

var cell = $('cell');

for (var i = 0; i != 8; i++)
	for (var j = 0; j != 8; j++) {
		var s = square[i][j];
		
		var c = cell.cloneNode(true);
		c.removeAttribute('id');
		c.style.display = '';
		$text(c, s.text);
		$data(c, 'pos', posNew(i, j));
		
		c.addEventListener('mousedown', cellMouseDown);
		c.addEventListener('mouseenter', cellMouseEnter);
		
		c.addEventListener('touchstart', cellTouchStart);
		c.addEventListener('touchmove', cellTouchMove);
		c.addEventListener('touchend', cellTouchEnd);
		
		s.node = c;
		
		cell.parentNode.appendChild(c);
	}

document.addEventListener('mousedown', docMouseDown);
document.addEventListener('mouseup', docMouseUp);

</script>
